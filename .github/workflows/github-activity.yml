name: GitHub activity snapshot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-activity.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/sync-github.mjs"
      - "scripts/github-calendar-parser.mjs"
      - "src/lib/github.ts"

permissions:
  contents: write

concurrency:
  group: github-activity
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync public GitHub snapshot
        run: pnpm sync:github

      - name: Commit snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/github.json; then
            echo "GitHub snapshot is unchanged."
          else
            git add -- src/data/github.json
            git commit -m "chore: update GitHub activity snapshot"
            git push
          fi
